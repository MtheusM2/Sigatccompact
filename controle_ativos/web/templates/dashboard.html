<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
     <!-- <link rel="stylesheet" href="index.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body class="dashboard">
    <header class="h_dashboard">
        <h1>Gestão de Ativos</h1>
    

    <section >
        <select class="ativosOpcoes" onchange="carregarPagina(this.value)">
            <option value="{{ url_for('dashboard_status') }}">Status dos ativos</option>
            <option value="{{ url_for('dashboard_buscar') }}">Buscar ativos</option>
            <option value="{{ url_for('dashboard_cadastrar') }}">Cadastrar ativos</option>
            <option value="{{ url_for('dashboard_editar') }}">Editar ativos</option>
            <option value="{{ url_for('dashboard_excluir') }}">Excluir ativos</option>
        </select>
    </section>

    </header>

    <div class="entrar_login">
            <input class="voltar" type="submit" value="Voltar" onclick="history.back();">
        </div>
    
    <main id="conteudo">
        
    </main>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

        function carregarPagina(pagina) {
                fetch(pagina)
                    .then(res => res.text())
                    .then(html => {
                        document.getElementById("conteudo").innerHTML = html;
                    });
        }

        window.onload = function() {
        carregarPagina("{{ url_for('dashboard_status') }}");
    }
    </script>
    <!-- script de cadastro de ativos -->

    <script>
document.addEventListener("submit", async function(e) {
    if (e.target && e.target.id === "cadastrar_ativos_form") {
        e.preventDefault();

        const tipo = document.getElementById('tipo').value;
        const marca = document.getElementById('marca').value;
        const modelo = document.getElementById('modelo').value;
        const usuarioResponsavel = document.getElementById('usuario_responsavel').value;
        const departamento = document.getElementById('departamento').value;
        const status = document.getElementById('status').value;
        const dataEntrada = document.getElementById('data_entrada').value;
        const dataSaida = document.getElementById('data_saida').value;

        try {
            console.log('Enviando dados para /ativos...');

            const response = await fetch('/ativos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken,
                },
                body: JSON.stringify({
                    tipo,
                    marca,
                    modelo,
                    usuario_responsavel: usuarioResponsavel,
                    departamento,
                    status,
                    data_entrada: dataEntrada,
                    data_saida: dataSaida || null
                })
            });

            const data = await response.json();
            console.log(data);

            if (data.ok) {
                alert('Ativo cadastrado com sucesso!');
                carregarPagina("{{ url_for('dashboard_status') }}");
            } else {
                alert('Erro: ' + data.erro);
            }
        } catch (err) {
            alert('Erro na requisição: ' + err.message);
        }
    }
});
</script>

</body>
</html>
