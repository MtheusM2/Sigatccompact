<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <!-- <link rel="stylesheet" href="index.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">


</head>

<body class="recovery">

<div class="conteiner_recovery"></div>
<h1 class="h1_recovery">Tela de Recuperação de Senha</h1>

    <form class="form_recovery" id="formRecovery">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        
        <label for="resposta_recuperacao">Resposta de Recuperação:</label>
        <input type="text" id="resposta_recuperacao" name="resposta_recuperacao" required>
        <br>
        
        <label for="senha">Nova Senha:</label>
        <input type="password" id="senha" name="senha" required>
        <br>

        <div class="botoes_cadastro">
            <input class="voltar" type="submit" value="Voltar" onclick="history.back();">
            <input class="nome_botao_cadastro" type="submit" value="Recuperar">
        </div>

        <!-- <a href="home.html">
            <button type="button">Entrar</button>
        </a> -->

    </form>

    </div>
    
    <script>
        document.getElementById('formRecovery').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const resposta = document.getElementById('resposta_recuperacao').value;
            const novaSenha = document.getElementById('senha').value;
            const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken,
                    },
                    body: JSON.stringify({
                        email: email,
                        resposta_recuperacao: resposta,
                        nova_senha: novaSenha
                    })
                });

                const data = await response.json();

                if (response.ok && data.ok) {
                    alert('Senha redefinida com sucesso!');
                    window.location.href = '/';
                } else {
                    alert('Erro ao recuperar senha: ' + (data.erro || 'Falha na operação.'));
                }
            } catch (error) {
                alert('Erro na requisição: ' + error.message);
            }
        });
    </script>
</body>

</html>
