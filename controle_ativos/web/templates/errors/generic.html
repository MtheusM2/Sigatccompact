<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} - {{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <style>
        body.erro-generico {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .erro-card {
            max-width: 560px;
            padding: 2rem;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.16);
            text-align: center;
        }

        .erro-card h1 {
            margin: 0 0 0.75rem;
        }

        .erro-card p {
            margin: 0 0 1.5rem;
            line-height: 1.5;
        }

        .erro-card a {
            display: inline-block;
            text-decoration: none;
        }
    </style>
</head>
<body class="erro-generico">
    <main class="erro-card">
        <h1>{{ status_code }} - {{ titulo }}</h1>
        <p>{{ mensagem }}</p>
        <a href="{{ url_for('home') }}">Voltar para o login</a>
    </main>
</body>
</html>
