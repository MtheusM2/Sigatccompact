{% extends "base.html" %}

{% block title %}Cadastrar ativos | Gestão de Ativos{% endblock %}

{% block content %}
<main class="page-shell">
    <section class="page-card form-panel">
        <div class="page-header">
            <p class="eyebrow">Operação permitida</p>
            <h1>Cadastro de Ativos</h1>
            <p class="page-lead">Preencha os campos básicos para registrar um novo ativo no inventário.</p>
        </div>

        <form class="form_cadastro_ativos" id="cadastrar_ativos_form">
            <div class="caixa_cadastro_ativos">
                <div class="linha1">
                    <div class="linhas">
                        <label for="tipo">Tipo:</label>
                        <select class="status_cadastro" name="tipo" id="tipo">
                            <option value="Notebook">Notebook</option>
                            <option value="Desktop">Desktop</option>
                            <option value="Monitor">Monitor</option>
                            <option value="Impressora">Impressora</option>
                            <option value="Periférico">Periférico</option>
                        </select>
                    </div>

                    <div class="linhas">
                        <label for="marca">Marca:</label>
                        <input type="text" id="marca" name="marca" required>
                    </div>

                    <div class="linhas">
                        <label for="modelo">Modelo:</label>
                        <input type="text" id="modelo" name="modelo" required>
                    </div>
                </div>

                <div class="linha2">
                    <div class="linhas">
                        <label for="email_responsavel">E-mail do responsável:</label>
                        <input type="email" id="email_responsavel" name="email_responsavel" placeholder="responsavel@exemplo.com">
                    </div>

                    <div class="linhas">
                        <label for="usuario_responsavel">Usuário Responsável:</label>
                        <input type="text" id="usuario_responsavel" name="usuario_responsavel" required>
                    </div>

                    <div class="linhas">
                        <label for="departamento">Departamento:</label>
                        <select class="status_cadastro" name="departamento" id="departamento">
                            <option value="TI">TI</option>
                            <option value="RH">RH</option>
                            <option value="Administração">Administração</option>
                            <option value="Financeiro">Financeiro</option>
                            <option value="Suporte">Suporte</option>
                        </select>
                    </div>

                    <div class="linhas">
                        <label for="status">Status:</label>
                        <select class="status_cadastro" name="status" id="status">
                            <option value="Disponível">Disponível</option>
                            <option value="Em Uso">Em Uso</option>
                            <option value="Em Manutenção">Em Manutenção</option>
                            <option value="Reservado">Reservado</option>
                            <option value="Baixado">Baixado</option>
                        </select>
                    </div>
                </div>

                <div class="linha3">
                    <div class="linhas">
                        <label for="data_entrada">Data de Entrada:</label>
                        <input type="date" id="data_entrada" name="data_entrada" required>
                    </div>
                    <div class="linhas">
                        <label for="data_saida">Data de Saída:</label>
                        <input type="date" id="data_saida" name="data_saida">
                    </div>
                </div>

                <div class="botoes_cadastro">
                    <input id="btn_cadastrar" name="btn_cadastrar" class="nome_botao_cadastro" type="submit" value="Cadastrar">
                </div>
            </div>
        </form>
    </section>
</main>
{% endblock %}
