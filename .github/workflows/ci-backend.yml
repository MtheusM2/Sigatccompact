# CI Backend - Testes e Segurança
# Projeto: DataAssets / Sistema de Controle de Ativos
#
# Objetivo:
# - Rodar validações automáticas em Pull Requests e pushes.
# - Bloquear merge se os testes existentes quebrarem.
# - Bloquear merge se houver problema básico de segurança.
# - Bloquear merge se arquivos indevidos forem versionados.
# - Alertar quando código for alterado sem teste novo/alterado, mas sem bloquear a PR.

name: CI Backend - Testes e Segurança

on:
  # Executa quando uma Pull Request for criada, atualizada ou reaberta.
  pull_request:
    branches:
      - main
      - MtheusM2-BackEnd
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # Executa quando houver push direto nas branches principais.
  push:
    branches:
      - main
      - MtheusM2-BackEnd

  # Permite rodar manualmente pela aba Actions.
  workflow_dispatch:

# Permissão mínima para o GITHUB_TOKEN.
# Este workflow apenas lê o código e executa validações.
permissions:
  contents: read

# Cancela execuções antigas do mesmo PR/branch para evitar gasto desnecessário.
concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Versão do Python usada no projeto.
  PYTHON_VERSION: "3.11"

  # Evita criação de bytecode Python desnecessário.
  PYTHONDONTWRITEBYTECODE: "1"

  # Mostra logs em tempo real.
  PYTHONUNBUFFERED: "1"

  # Ambiente de teste.
  FLASK_ENV: "testing"
  FLASK_DEBUG: "0"

  # Chave apenas para CI. Não usar em produção.
  FLASK_SECRET_KEY: "ci-test-secret-key-not-production"

  # Banco de dados de teste usado pelo runner do GitHub Actions.
  DB_HOST: "127.0.0.1"
  DB_PORT: "3306"
  DB_USER: "root"
  DB_PASSWORD: "root"
  DB_NAME: "controle_ativos_test"

  # Variáveis alternativas para compatibilidade com nomes comuns no projeto.
  MYSQL_HOST: "127.0.0.1"
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"
  MYSQL_PASSWORD: "root"
  MYSQL_DATABASE: "controle_ativos_test"

jobs:
  testes-e-seguranca:
    name: Testes Python e segurança
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: controle_ativos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 permite comparar corretamente arquivos alterados na PR.
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            controle_ativos/requirements*.txt
            pyproject.toml
            setup.py

      - name: Mascarar valores sensíveis nos logs
        run: |
          set -euo pipefail

          # Mesmo sendo valores de teste, eles são mascarados para manter boa prática.
          echo "::add-mask::$FLASK_SECRET_KEY"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$MYSQL_PASSWORD"

      - name: Detectar arquivos alterados
        run: |
          set -euo pipefail

          # Em Pull Request, compara a branch da PR com a branch base.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            # Em push, compara o commit anterior com o commit atual.
            BASE_SHA="${{ github.event.before || '' }}"
            HEAD_SHA="${{ github.sha }}"

            # Caso seja o primeiro push da branch, usa o primeiro commit do histórico.
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee changed-files.txt

      - name: Alertar quando houver código alterado sem teste novo ou alterado
        run: |
          set -euo pipefail

          # Esta etapa apenas alerta. Ela NÃO bloqueia a PR.
          # Os bloqueios reais acontecem nos testes, segurança, sintaxe e arquivos proibidos.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Evento não é Pull Request. Pulando alerta de testes novos."
            exit 0
          fi

          # Arquivos considerados código relevante do backend.
          CODE_CHANGED="$(
            grep -E \
              '(^controle_ativos/.*\.(py|html|js|css)$|^controle_ativos/database/migrations/.*\.sql$|^requirements.*\.txt$|^pyproject\.toml$|^setup\.py$)' \
              changed-files.txt || true
          )"

          # Arquivos considerados testes.
          TEST_CHANGED="$(
            grep -E \
              '(^tests/.*\.py$|^controle_ativos/tests/.*\.py$)' \
              changed-files.txt || true
          )"

          if [[ -n "$CODE_CHANGED" && -z "$TEST_CHANGED" ]]; then
            echo "::warning title=Testes recomendados::Código foi alterado, mas nenhum teste novo ou alterado foi detectado. A PR poderá continuar se os testes existentes e as validações de segurança passarem."

            echo ""
            echo "Arquivos de código alterados:"
            echo "$CODE_CHANGED"

            echo ""
            echo "Recomendação:"
            echo "- Criar ou atualizar testes em tests/ ou controle_ativos/tests/."
            echo "- Priorizar testes para rotas, services, validações, autenticação, autorização, importação e banco."
            echo "- Rodar localmente: python -m pytest -q"

            # exit 0 mantém o workflow aprovado nessa etapa.
            exit 0
          fi

          echo "Nenhuma ausência de teste novo foi detectada."

      - name: Instalar dependências
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          # Detecta automaticamente o requirements.txt.
          REQ_FILE=""

          if [[ -f "controle_ativos/requirements.txt" ]]; then
            REQ_FILE="controle_ativos/requirements.txt"
          elif [[ -f "requirements.txt" ]]; then
            REQ_FILE="requirements.txt"
          fi

          if [[ -n "$REQ_FILE" ]]; then
            echo "Instalando dependências de: $REQ_FILE"
            python -m pip install -r "$REQ_FILE"
            echo "REQ_FILE=$REQ_FILE" >> "$GITHUB_ENV"
          else
            echo "::warning::Nenhum requirements.txt encontrado. Instalando apenas ferramentas de CI."
            echo "REQ_FILE=" >> "$GITHUB_ENV"
          fi

          # Ferramentas usadas apenas no CI.
          python -m pip install pytest pytest-cov bandit pip-audit mysql-connector-python

      - name: Preparar banco MySQL de teste
        run: |
          set -euo pipefail

          # Cria o banco de teste no MySQL do runner.
          # Não usa credenciais reais do projeto.
          python - <<'PY'
          import os
          import time
          import mysql.connector

          host = os.getenv("DB_HOST", "127.0.0.1")
          port = int(os.getenv("DB_PORT", "3306"))
          user = os.getenv("DB_USER", "root")
          password = os.getenv("DB_PASSWORD", "root")
          database = os.getenv("DB_NAME", "controle_ativos_test")

          last_error = None

          for tentativa in range(1, 31):
              try:
                  conn = mysql.connector.connect(
                      host=host,
                      port=port,
                      user=user,
                      password=password,
                  )
                  cursor = conn.cursor()
                  cursor.execute(
                      f"CREATE DATABASE IF NOT EXISTS `{database}` "
                      "CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
                  )
                  cursor.close()
                  conn.close()
                  print(f"Banco de teste preparado: {database}")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Aguardando MySQL subir... tentativa {tentativa}/30")
                  time.sleep(2)
          else:
              raise RuntimeError(f"MySQL não ficou disponível: {last_error}")
          PY

      - name: Validar se existem testes no projeto
        run: |
          set -euo pipefail

          # Esta etapa bloqueia somente se o projeto não tiver nenhum teste.
          # Se o projeto já tem testes, eles serão executados na etapa de pytest.
          TEST_FILES="$(
            find . \
              -path './.git' -prune -o \
              -path './.venv' -prune -o \
              -path './venv' -prune -o \
              -type f \( -path './tests/*' -o -path './controle_ativos/tests/*' \) \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -print
          )"

          if [[ -z "$TEST_FILES" ]]; then
            echo "::error::Nenhum teste pytest foi encontrado no projeto."
            echo "Crie testes em tests/ ou controle_ativos/tests/."
            exit 1
          fi

          echo "Testes encontrados:"
          echo "$TEST_FILES"

      - name: Bloquear arquivos indevidos versionados
        run: |
          set -euo pipefail

          # Impede merge de bytecode, cache Python, .env real e logs.
          TRACKED_BAD_FILES="$(
            git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$|\.env$|\.env\.local$|\.env\.production$|.*\.log$)' || true
          )"

          if [[ -n "$TRACKED_BAD_FILES" ]]; then
            echo "::error::Arquivos sensíveis ou temporários estão versionados:"
            echo "$TRACKED_BAD_FILES"
            echo ""
            echo "Correção sugerida:"
            echo "git rm --cached caminho/do/arquivo"
            echo "Adicionar padrões ao .gitignore."
            exit 1
          fi

          echo "Nenhum arquivo proibido versionado foi encontrado."

      - name: Buscar padrões perigosos no código
        run: |
          set -euo pipefail

          # Busca padrões básicos de risco em arquivos Python.
          # Testes são ignorados para não bloquear exemplos controlados.
          MATCHES="$(
            grep -RIn \
              --include='*.py' \
              --exclude-dir='.git' \
              --exclude-dir='.venv' \
              --exclude-dir='venv' \
              --exclude-dir='__pycache__' \
              --exclude-dir='tests' \
              -E 'dev-secret-key-change-me|app\.run\(.*debug=True|debug=True' \
              controle_ativos || true
          )"

          if [[ -n "$MATCHES" ]]; then
            echo "::error::Foram encontrados padrões perigosos no código:"
            echo "$MATCHES"
            echo ""
            echo "Correção necessária:"
            echo "- Remover secret_key hardcoded."
            echo "- Não deixar debug=True fixo."
            echo "- Controlar debug por variável de ambiente com padrão seguro."
            exit 1
          fi

          echo "Nenhum padrão perigoso básico foi encontrado."

      - name: Validar sintaxe Python
        run: |
          set -euo pipefail

          # Verifica se todos os arquivos Python compilam.
          python -m compileall -q controle_ativos

      - name: Análise estática de segurança com Bandit
        run: |
          set -euo pipefail

          # -lll bloqueia apenas achados de severidade alta.
          # Depois, se quiser ser mais rígido, pode trocar para -ll.
          bandit -r controle_ativos -x "controle_ativos/tests,tests" -lll

      - name: Auditoria de dependências com pip-audit
        run: |
          set -euo pipefail

          # Audita vulnerabilidades conhecidas nas dependências.
          # Se existir requirements.txt, audita o arquivo declarado.
          if [[ -n "${REQ_FILE:-}" && -f "$REQ_FILE" ]]; then
            pip-audit -r "$REQ_FILE" --strict
          else
            pip-audit --strict
          fi

      - name: Rodar todos os testes
        run: |
          set -euo pipefail

          # Garante que imports funcionem tanto da raiz quanto de controle_ativos.
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/controle_ativos:${PYTHONPATH:-}"

          TEST_PATHS=()

          if [[ -d "tests" ]]; then
            TEST_PATHS+=("tests")
          fi

          if [[ -d "controle_ativos/tests" ]]; then
            TEST_PATHS+=("controle_ativos/tests")
          fi

          if [[ "${#TEST_PATHS[@]}" -eq 0 ]]; then
            echo "::error::Nenhuma pasta de testes encontrada."
            exit 1
          fi

          echo "Executando testes em:"
          printf '%s\n' "${TEST_PATHS[@]}"

          python -m pytest "${TEST_PATHS[@]}" \
            -q \
            --disable-warnings \
            --maxfail=1 \
            --junitxml=pytest-results.xml

      - name: Publicar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
